[project]
name = "message-classify"
version = "0.1.0"
description = "Campus message classification course project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "joblib>=1.6.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
